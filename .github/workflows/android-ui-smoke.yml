name: Android HTML Linux smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Linux browser availability
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Test the Android-only HTML in headless Chromium
        run: node tests/linux-ui-smoke.cjs
