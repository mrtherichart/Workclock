name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'
      - name: Build Android debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify Android 10 APK compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          SDK_TOOLS="${ANDROID_HOME}/build-tools/36.0.0"
          "${SDK_TOOLS}/zipalign" -c -v 4 "$APK"
          "${SDK_TOOLS}/apksigner" verify --verbose --print-certs --min-sdk-version 29 --max-sdk-version 29 "$APK"
          "${SDK_TOOLS}/aapt" dump badging "$APK" | grep -E '^(package:|sdkVersion:|targetSdkVersion:|launchable-activity:|application-label:)'
          unzip -t "$APK" | tail -1
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: workclock-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14